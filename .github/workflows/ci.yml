name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hard gate: nothing that looks like a secret may enter the history.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest # ships the Android SDK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build libraries, run tests, assemble sample apps
        run: >
          ./gradlew
          :voiceagent-core:build
          :voiceagent-transport:build
          :voiceagent-audio:build
          :voiceagent-provider-grok:build
          :sharedLogic:build
          :sharedUI:build
          :androidApp:assembleDebug
          :desktopApp:build
          -x jsBrowserTest

  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Validate Worker config (no deploy, no credentials)
        run: npx wrangler deploy --dry-run
